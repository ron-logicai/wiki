services:
  # Local MySQL for offline development and the browser tests; the same version as the real server.
  # It has its own fixed credentials (wiki/wiki, only reachable from this machine), separate from the
  # WIKI_DB_* values in .env, which point the application at the real database.
  db:
    image: mysql:9.1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wiki
      MYSQL_USER: wiki
      MYSQL_PASSWORD: wiki
      MYSQL_ROOT_PASSWORD: wiki
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - wiki-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uwiki -pwiki --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Without WIKI_DB_* in .env the app uses the MySQL container above.
      WIKI_DB_URL: ${WIKI_DB_URL:-jdbc:mysql://db:3306/wiki?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
      WIKI_DB_USERNAME: ${WIKI_DB_USERNAME:-wiki}
      WIKI_DB_PASSWORD: ${WIKI_DB_PASSWORD:-wiki}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      WIKI_ENTRA_TENANT_ID: ${WIKI_ENTRA_TENANT_ID:-}
      WIKI_ENTRA_CLIENT_ID: ${WIKI_ENTRA_CLIENT_ID:-}
      WIKI_ENTRA_CLIENT_SECRET: ${WIKI_ENTRA_CLIENT_SECRET:-}
      WIKI_ATTACHMENTS_DIR: /app/data/attachments
      WIKI_BASE_URL: ${WIKI_BASE_URL:-http://localhost:8080}
      WIKI_MAIL_GRAPH_SENDER: ${WIKI_MAIL_GRAPH_SENDER:-}
      WIKI_MAIL_HOST: ${WIKI_MAIL_HOST:-}
      WIKI_MAIL_PORT: ${WIKI_MAIL_PORT:-587}
      WIKI_MAIL_STARTTLS: ${WIKI_MAIL_STARTTLS:-true}
      WIKI_MAIL_USERNAME: ${WIKI_MAIL_USERNAME:-}
      WIKI_MAIL_PASSWORD: ${WIKI_MAIL_PASSWORD:-}
      WIKI_MAIL_FROM: ${WIKI_MAIL_FROM:-wiki@logicai.nl}
    volumes:
      - wiki-attachments:/app/data
    ports:
      - "8080:8080"

volumes:
  wiki-mysql-data:
  wiki-attachments:
