services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WIKI_DB_NAME:-wiki}
      POSTGRES_USER: ${WIKI_DB_USERNAME:-wiki}
      POSTGRES_PASSWORD: ${WIKI_DB_PASSWORD:?set WIKI_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wiki-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WIKI_DB_USERNAME:-wiki} -d ${WIKI_DB_NAME:-wiki}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WIKI_DB_URL: jdbc:postgresql://db:5432/${WIKI_DB_NAME:-wiki}
      WIKI_DB_USERNAME: ${WIKI_DB_USERNAME:-wiki}
      WIKI_DB_PASSWORD: ${WIKI_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      WIKI_ENTRA_TENANT_ID: ${WIKI_ENTRA_TENANT_ID:-}
      WIKI_ENTRA_CLIENT_ID: ${WIKI_ENTRA_CLIENT_ID:-}
      WIKI_ENTRA_CLIENT_SECRET: ${WIKI_ENTRA_CLIENT_SECRET:-}
      WIKI_ATTACHMENTS_DIR: /app/data/attachments
    volumes:
      - wiki-attachments:/app/data
    ports:
      - "8080:8080"

volumes:
  wiki-db-data:
  wiki-attachments:
