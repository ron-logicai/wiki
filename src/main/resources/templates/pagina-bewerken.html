<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/editor/editor.css}">
    <title th:text="'Bewerken: ' + ${pagina.title} + ' · LogicAI Wiki'">Bewerken · LogicAI Wiki</title>
</head>
<body>

<div class="app">
    <nav th:replace="~{fragments :: zijbalk(null)}"></nav>

    <div class="hoofd">
        <div class="top">
            <nav th:replace="~{fragments :: kruimels(${ouders}, ${pagina})}"></nav>
            <span class="sep">/</span>
            <span class="gedempt">Bewerken</span>
            <span class="top__ruimte"></span>
            <a class="knop" th:href="@{/pages/{id}(id=${pagina.id})}">Annuleren</a>
        </div>

        <main class="pagina">
            <div class="kolom">
                <label class="verborgen" for="page-title">Titel</label>
                <input id="page-title" class="titel-invoer" type="text" th:value="${pagina.title}"
                       required placeholder="Titel">

                <noscript>
                    <p class="melding" role="alert">
                        De editor heeft JavaScript nodig. De bestaande inhoud is niet gewijzigd.
                        <a th:href="@{/pages/{id}(id=${pagina.id})}">Terug naar de pagina</a>.
                    </p>
                </noscript>

                <!-- De BlockNote-editor (React) wordt hier gemount; zie frontend/src/main.tsx. -->
                <div id="editor-root"
                     th:attr="data-page-id=${pagina.id},data-base-version=${pagina.lockVersion},data-upload-url=@{/api/attachments(pageId=${pagina.id})}">
                    <p class="leeg">Editor wordt geladen…</p>
                </div>
                <script id="editor-document" type="application/json" th:utext="${documentJson}">[]</script>
            </div>
        </main>
    </div>
</div>

<script type="module" th:src="@{/editor/editor.js}"></script>

</body>
</html>
