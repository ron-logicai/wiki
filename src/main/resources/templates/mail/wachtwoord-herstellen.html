<!DOCTYPE html>
<!--
  Mail voor "wachtwoord vergeten" (spec F-01), zelfde opmaak als de uitnodiging (ontwerp 28-10-2026).
  Gerenderd door MailTemplates. Model: naam, gebruikersnaam, link, geldigheid.
-->
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Nieuw wachtwoord instellen voor de LogicAI wiki</title>
<!--[if mso]><style>table,td{font-family:Arial,Helvetica,sans-serif !important;}</style><![endif]-->
<style>
@media only screen and (max-width:620px){
  .wrap{width:100% !important;}
  .pad{padding-left:24px !important;padding-right:24px !important;}
}
</style>
</head>
<body style="margin:0;padding:0;background-color:#F7F7F7;">
<span style="display:none;font-size:1px;color:#F7F7F7;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;"
      th:text="|Kies een nieuw wachtwoord voor je account ${gebruikersnaam} op de LogicAI wiki.|">Preheader</span>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#F7F7F7;">
<tr><td align="center" style="padding:40px 16px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="wrap" style="width:600px;max-width:600px;">

  <tr th:replace="~{mail/fragments :: merk}"></tr>

  <tr th:replace="~{mail/fragments :: kop('Interne wiki', 'Nieuw wachtwoord instellen')}"></tr>

  <tr><td style="background-color:#FFFFFF;padding:36px 48px 8px;" class="pad">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
      <tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:27px;mso-line-height-rule:exactly;color:#1C2143;padding-bottom:18px;" th:text="|Hoi ${naam},|">Hoi Ron,</td></tr>
      <tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:27px;mso-line-height-rule:exactly;color:#1C2143;padding-bottom:18px;">
        Er is gevraagd om een nieuw wachtwoord voor je account “<strong th:text="${gebruikersnaam}">ron</strong>” op de LogicAI wiki.
      </td></tr>
      <tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:27px;mso-line-height-rule:exactly;color:#1C2143;padding-bottom:28px;">Kies via de knop een nieuw wachtwoord; daarna log je daarmee in.</td></tr>
      <tr th:replace="~{mail/fragments :: knop('Nieuw wachtwoord kiezen', ${link})}"></tr>
      <tr th:replace="~{mail/fragments :: kader(${geldigheid}, ${link})}"></tr>
    </table>
  </td></tr>

  <tr th:replace="~{mail/fragments :: voet('Heb je dit niet aangevraagd? Negeer deze mail; je wachtwoord blijft ongewijzigd.')}"></tr>

  <tr th:replace="~{mail/fragments :: onderschrift}"></tr>

</table>
</td></tr>
</table>
</body>
</html>
