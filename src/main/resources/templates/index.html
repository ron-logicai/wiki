<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: head}"></th:block>
    <title>Start · LogicAI Wiki</title>
</head>
<body>

<header th:replace="~{fragments :: kop}"></header>

<div class="schil">
    <nav th:replace="~{fragments :: zijbalk}"></nav>

    <main class="inhoud">
        <h1>Welkom</h1>
        <p>Kennis vastleggen, terugvinden en delen. Elke pagina heeft een blijvende link.</p>
        <p><a class="knop" th:href="@{/pages/new}">Nieuwe pagina</a></p>

        <h2>Recent gewijzigd</h2>
        <p class="leeg" th:if="${recentePaginas.isEmpty()}">Er zijn nog geen pagina's. Maak de eerste aan.</p>
        <ul class="paginalijst" th:unless="${recentePaginas.isEmpty()}">
            <li th:each="p : ${recentePaginas}">
                <a th:href="@{/pages/{id}(id=${p.id})}" th:text="${p.title}">Titel</a>
                <span class="meta">
                    door <span th:text="${p.updatedBy}">iemand</span>,
                    <time th:datetime="${p.updatedAt}" th:text="${#temporals.format(p.updatedAt, 'd MMM yyyy HH:mm')}">datum</time>
                </span>
            </li>
        </ul>
    </main>
</div>

</body>
</html>
