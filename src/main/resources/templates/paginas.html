<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: head}"></th:block>
    <title>Alle pagina's · LogicAI Wiki</title>
</head>
<body>

<div class="app">
    <nav th:replace="~{fragments :: zijbalk('paginas')}"></nav>

    <div class="hoofd">
        <div class="top">
            <span>Alle pagina's</span>
            <span class="top__ruimte"></span>
            <a class="knop knop--primair" th:href="@{/pages/new}">+ Nieuwe pagina</a>
        </div>

        <main class="pagina">
            <div class="kolom">
                <div class="kop">
                    <p class="eyebrow">Overzicht</p>
                    <h1>Alle pagina's</h1>
                    <p class="intro">Alfabetisch, met wie de pagina het laatst heeft bijgewerkt.</p>
                </div>

                <p class="leeg" th:if="${paginas.isEmpty()}">Er zijn nog geen pagina's.</p>
                <div class="lijst" th:unless="${paginas.isEmpty()}">
                    <div class="lijst__kop" aria-hidden="true">
                        <span>Titel</span>
                        <span class="rij__ruimte">Bijgewerkt door</span>
                        <span class="rij__tijd">Bijgewerkt</span>
                    </div>
                    <ul class="rijen">
                        <li class="rij" th:each="p : ${paginas}">
                            <span class="icoon" th:insert="~{fragments :: icoon('bestand')}"></span>
                            <span class="rij__titel"><a th:href="@{/pages/{id}(id=${p.id})}" th:text="${p.title}">Titel</a></span>
                            <span class="rij__ruimte" th:text="${p.updatedBy}">iemand</span>
                            <time class="rij__tijd" th:datetime="${p.updatedAt}" th:text="${@datums.relatief(p.updatedAt)}">datum</time>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
