<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <th:block th:replace="~{fragments :: head}"></th:block>
    <title th:text="${pagina.title} + ' · LogicAI Wiki'">Pagina · LogicAI Wiki</title>
</head>
<body>

<div class="app">
    <nav th:replace="~{fragments :: zijbalk(null)}"></nav>

    <div class="hoofd">
        <div class="top">
            <nav th:replace="~{fragments :: kruimels(${ouders}, ${pagina})}"></nav>
            <span class="top__ruimte"></span>
            <a class="knop knop--icoon" th:href="@{/pages/new(parentId=${pagina.id})}" title="Subpagina"
               aria-label="Subpagina"><span class="icoon" th:insert="~{fragments :: icoon('bestand-plus')}"></span></a>
            <a class="knop knop--icoon" th:href="@{/pages/{id}/move(id=${pagina.id})}" title="Verplaatsen"
               aria-label="Verplaatsen"><span class="icoon" th:insert="~{fragments :: icoon('verplaatsen')}"></span></a>
            <a class="knop knop--icoon" th:href="@{/pages/{id}/history(id=${pagina.id})}" title="Geschiedenis"
               aria-label="Geschiedenis"><span class="icoon" th:insert="~{fragments :: icoon('geschiedenis')}"></span></a>
            <a class="knop knop--icoon" th:href="@{/pages/{id}/export.md(id=${pagina.id})}" download
               title="Deze pagina downloaden als Markdown (.md)"
               aria-label="Exporteren"><span class="icoon" th:insert="~{fragments :: icoon('download')}"></span></a>
            <a class="knop knop--icoon" th:href="@{/pages/{id}/edit(id=${pagina.id})}" title="Bewerken"
               aria-label="Bewerken"><span class="icoon" th:insert="~{fragments :: icoon('potlood')}"></span></a>
            <form sec:authorize="hasAnyRole('EDITOR', 'ADMIN')" th:action="@{/pages/{id}/delete(id=${pagina.id})}" method="post"
                  onsubmit="return confirm('Deze pagina naar de prullenbak verplaatsen? Je kunt haar daar herstellen.')">
                <input type="hidden" name="baseVersion" th:value="${pagina.lockVersion}">
                <button type="submit" class="knop knop--icoon" title="Verwijderen"
                        aria-label="Verwijderen"><span class="icoon" th:insert="~{fragments :: icoon('prullenbak')}"></span></button>
            </form>
        </div>

        <main class="pagina" th:attr="data-page-id=${pagina.id}">
            <div class="kolom">
                <h1 th:text="${pagina.title}">Titel</h1>
                <div class="labels">
                    <span class="label">Versie <span th:text="${pagina.currentRevision}">1</span></span>
                    <span class="label" th:text="${pagina.updatedBy}">iemand</span>
                    <time class="label" th:datetime="${pagina.updatedAt}" th:text="${@datums.relatief(pagina.updatedAt)}">datum</time>
                </div>

                <!-- Eigenaar, status en laatste controle (spec U-07, U-08) -->
                <div class="labels eigenschappen">
                    <th:block sec:authorize="!hasAnyRole('EDITOR', 'ADMIN')">
                        <span class="label"><span class="icoon" th:insert="~{fragments :: icoon('gebruiker')}"></span>Eigenaar:
                            <span th:text="${eigenaarNaam ?: 'geen'}">naam</span></span>
                        <span class="label" th:classappend="'status--' + ${#strings.toLowerCase(pagina.status)}"
                              th:text="${pagina.status.label}">Status</span>
                    </th:block>
                    <form sec:authorize="hasAnyRole('EDITOR', 'ADMIN')" class="eigenschappenformulier"
                          th:action="@{/pages/{id}/properties(id=${pagina.id})}" method="post">
                        <input type="hidden" name="baseVersion" th:value="${pagina.lockVersion}">
                        <span class="icoon" th:insert="~{fragments :: icoon('gebruiker')}"></span>
                        <label class="verborgen" for="eigenaar">Eigenaar</label>
                        <select id="eigenaar" name="owner">
                            <option value="">Geen eigenaar</option>
                            <option th:each="u : ${eigenaren}" th:value="${u.username}" th:text="${u.displayName}"
                                    th:selected="${u.username == pagina.owner}">naam</option>
                        </select>
                        <label class="verborgen" for="status">Status</label>
                        <select id="status" name="status" class="status" th:classappend="'status--' + ${#strings.toLowerCase(pagina.status)}">
                            <option th:each="s : ${statussen}" th:value="${s}" th:text="${s.label}" th:selected="${s == pagina.status}">Status</option>
                        </select>
                        <button type="submit" class="knop">Opslaan</button>
                    </form>
                    <span class="label" th:if="${pagina.reviewedAt != null}"><span class="icoon" th:insert="~{fragments :: icoon('klok')}"></span>Gecontroleerd door
                        <span th:text="${gecontroleerdDoorNaam}">iemand</span>,
                        <time th:datetime="${pagina.reviewedAt}" th:text="${@datums.relatief(pagina.reviewedAt)}">datum</time></span>
                    <span class="label" th:unless="${pagina.reviewedAt != null}"><span class="icoon" th:insert="~{fragments :: icoon('klok')}"></span>Nog niet gecontroleerd</span>
                    <form sec:authorize="hasAnyRole('EDITOR', 'ADMIN')" th:action="@{/pages/{id}/review(id=${pagina.id})}" method="post">
                        <input type="hidden" name="baseVersion" th:value="${pagina.lockVersion}">
                        <button type="submit" class="knop" title="Markeer deze pagina als zojuist gecontroleerd">Gecontroleerd</button>
                    </form>
                </div>

                <p class="melding melding--info" th:if="${melding != null}" th:text="${melding}">Melding</p>
                <p class="melding" role="alert" th:if="${fout != null}" th:text="${fout}">Fout</p>
                <div class="tags">
                    <span class="label label--tag" th:each="t : ${tags}">
                        <span th:text="${t.name}">tag</span>
                        <form sec:authorize="hasAnyRole('EDITOR', 'ADMIN')" th:action="@{/pages/{id}/tags/{tagId}/remove(id=${pagina.id}, tagId=${t.id})}" method="post">
                            <button type="submit" class="label__verwijder" th:attr="aria-label='Tag ' + ${t.name} + ' verwijderen'">&times;</button>
                        </form>
                    </span>
                    <form sec:authorize="hasAnyRole('EDITOR', 'ADMIN')" class="tagformulier" th:action="@{/pages/{id}/tags(id=${pagina.id})}" method="post">
                        <label class="verborgen" for="tagnaam">Tag toevoegen</label>
                        <input id="tagnaam" name="name" maxlength="50" placeholder="Tag toevoegen" required>
                        <button type="submit" class="knop">Toevoegen</button>
                    </form>
                </div>

                <article class="paginainhoud" th:utext="${inhoudHtml}"></article>
                <p class="leeg" th:if="${#strings.isEmpty(inhoudHtml)}">
                    Deze pagina is nog leeg. <a th:href="@{/pages/{id}/edit(id=${pagina.id})}">Begin met schrijven</a>.
                </p>

                <section th:unless="${subpaginas.isEmpty()}">
                    <h2>Subpagina's</h2>
                    <ul class="rijen">
                        <li class="rij" th:each="s : ${subpaginas}">
                            <span class="icoon" th:insert="~{fragments :: icoon('bestand')}"></span>
                            <span class="rij__titel"><a th:href="@{/pages/{id}(id=${s.id})}" th:text="${s.title}">Subpagina</a></span>
                            <time class="rij__tijd" th:datetime="${s.updatedAt}" th:text="${@datums.relatief(s.updatedAt)}">datum</time>
                        </li>
                    </ul>
                </section>
            </div>
        </main>
    </div>
</div>

</body>
</html>
