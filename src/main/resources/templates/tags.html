<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <th:block th:replace="~{fragments :: head}"></th:block>
    <title>Tags · LogicAI Wiki</title>
</head>
<body>

<div class="app">
    <nav th:replace="~{fragments :: zijbalk('tags')}"></nav>

    <div class="hoofd">
        <div class="top">
            <span>Tags</span>
            <span class="top__ruimte"></span>
        </div>

        <main class="pagina">
            <div class="kolom">
                <h1>Tags</h1>
                <p class="intro">
                    Een tag is een label dat op meerdere pagina's kan staan. Je voegt tags toe op de pagina zelf.
                    <span sec:authorize="hasRole('ADMIN')">Als beheerder kun je ze hier hernoemen of verwijderen; pagina's blijven bestaan.</span>
                </p>

                <p class="melding melding--info" th:if="${melding != null}" th:text="${melding}">Melding</p>
                <p class="melding" role="alert" th:if="${fout != null}" th:text="${fout}">Fout</p>

                <p class="leeg" th:if="${tags.isEmpty()}">Er zijn nog geen tags.</p>
                <ul class="rijen" th:unless="${tags.isEmpty()}">
                    <li class="rij" th:each="t : ${tags}">
                        <span class="icoon" th:insert="~{fragments :: icoon('tag')}"></span>
                        <span class="rij__titel">
                            <span class="label label--tag" th:text="${t.tag.name}">tag</span>
                        </span>
                        <span class="rij__ruimte"><span th:text="${t.paginas}">0</span> pagina's</span>
                        <th:block sec:authorize="hasRole('ADMIN')">
                            <form class="tagformulier" th:action="@{/tags/{id}/rename(id=${t.tag.id})}" method="post">
                                <label class="verborgen" th:for="'naam-' + ${t.tag.id}">Nieuwe naam</label>
                                <input th:id="'naam-' + ${t.tag.id}" name="name" th:value="${t.tag.name}" maxlength="50" required>
                                <button type="submit" class="knop">Hernoemen</button>
                            </form>
                            <form th:action="@{/tags/{id}/delete(id=${t.tag.id})}" method="post"
                                  onsubmit="return confirm('Deze tag verwijderen? De pagina&#39;s blijven bestaan.')">
                                <button type="submit" class="knop">Verwijderen</button>
                            </form>
                        </th:block>
                    </li>
                </ul>
            </div>
        </main>
    </div>
</div>

</body>
</html>
