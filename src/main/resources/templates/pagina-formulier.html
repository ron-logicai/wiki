<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: head}"></th:block>
    <title>Nieuwe pagina · LogicAI Wiki</title>
</head>
<body>

<div class="app">
    <nav th:replace="~{fragments :: zijbalk(null)}"></nav>

    <div class="hoofd">
        <div class="top">
            <span th:if="${ouder != null}" class="gedempt" th:text="${ouder.title}">Ouder</span>
            <span th:if="${ouder != null}" class="sep">/</span>
            <span>Nieuwe pagina</span>
            <span class="top__ruimte"></span>
        </div>

        <main class="pagina">
            <div class="kolom">
                <h1>Nieuwe pagina</h1>
                <p class="intro" th:if="${ouder != null}">
                    Wordt een subpagina van <a th:href="@{/pages/{id}(id=${ouder.id})}" th:text="${ouder.title}">ouder</a>; je kunt hieronder een andere plek kiezen.
                </p>
                <p class="intro" th:if="${ouder == null}">Kies een titel, de plek in de boom en eventueel een template.</p>

                <form th:action="@{/pages}" th:object="${form}" method="post" class="formulier">
                    <div class="veld">
                        <label for="parentId">Plek</label>
                        <select id="parentId" th:field="*{parentId}">
                            <option value="">Hoofdniveau (nieuwe ruimte)</option>
                            <option th:each="p : ${plekken}" th:value="${p.page.id}"
                                    th:text="${#strings.repeat('— ', p.depth)} + ${p.page.title}">Pagina</option>
                        </select>
                    </div>
                    <div class="veld">
                        <label for="title">Titel</label>
                        <input id="title" type="text" th:field="*{title}" maxlength="200" required autofocus
                               th:attr="aria-invalid=${#fields.hasErrors('title')} ? 'true' : null">
                        <p class="veld__fout" th:each="e : ${#fields.errors('title')}" th:text="${e}">Fout</p>
                    </div>
                    <div class="veld">
                        <label for="templateId">Template</label>
                        <select id="templateId" th:field="*{templateId}">
                            <option value="">Leeg</option>
                            <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.title}">Template</option>
                        </select>
                        <p class="gedempt klein" th:unless="${#lists.isEmpty(templates)}">De pagina begint met de opzet van het template en krijgt een eigen kopie.</p>
                    </div>
                    <div class="acties">
                        <button type="submit" class="knop knop--primair">Aanmaken</button>
                        <a class="knop" th:href="${ouder != null} ? @{/pages/{id}(id=${ouder.id})} : @{/pages}">Annuleren</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
