name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: editor-bundle
          path: src/main/resources/static/editor

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: editor-bundle
          path: src/main/resources/static/editor
      # Testcontainers starts mysql:9.1 through the runner's Docker daemon.
      - run: ./mvnw -B verify

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t wiki:ci .
      - name: Java-versie in de image
        run: docker run --rm --entrypoint java wiki:ci -version
      # CVE-2026-114938 (Java4Shell): de vlag uit de Dockerfile moet aan blijven staan. Deze stap mag weg zodra
      # de image op Temurin 25.0.5.1 of hoger draait en de vlag uit Dockerfile en fly.toml is gehaald.
      - name: Base64-intrinsic staat uit
        run: |
          docker run --rm --entrypoint java wiki:ci -XX:+PrintFlagsFinal -version \
            | grep -E 'UseBASE64Intrinsics += false'
      # Besturingssysteempakketten en jars in de image. Trivy herkent de Java-runtime zelf niet betrouwbaar,
      # die wordt hierboven apart gecontroleerd.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wiki:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend
    services:
      db:
        image: mysql:9.1
        env:
          MYSQL_DATABASE: wiki
          MYSQL_USER: wiki
          MYSQL_PASSWORD: wiki
          MYSQL_ROOT_PASSWORD: wiki
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uwiki -pwiki --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start application
        run: |
          ./mvnw -B -DskipTests package
          SPRING_PROFILES_ACTIVE=local java -jar target/*.jar &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
